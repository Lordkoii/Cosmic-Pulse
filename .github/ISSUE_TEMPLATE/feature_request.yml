name: QOL / Feature Suggestion
description: Suggest a usability improvement, diagnostic feature, or new idea for Cosmic Pulse.
title: "[QOL]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Cosmic Pulse. Small quality-of-life ideas and diagnostic workflow improvements are especially useful during alpha development.

  - type: input
    id: version
    attributes:
      label: Cosmic Pulse version
      description: Add the version you are using if applicable.
      placeholder: v0.1.0-alpha.0

  - type: textarea
    id: idea
    attributes:
      label: What would you change or add?
      description: Describe the feature, improvement, or workflow change you would like to see.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: What problem would this solve?
      description: Explain the frustration, missing information, or use case behind the idea.
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: How should it work?
      description: If you have a preferred behavior, screen layout, diagnostic output, or interaction, describe it here.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, examples, or anything else that may help.
